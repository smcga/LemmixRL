# The game on GitHub Pages, to play it on a phone: the default branch (master or main) at
# https://<owner>.github.io/<repo>/, and every pull request at https://<owner>.github.io/<repo>/pr-<number>/ (a comment
# on the pull request links to it; the preview goes away when the pull request is closed). (The production site is
# Cloudflare Pages, which deploys main: see the README.) The site is the gh-pages branch, which this workflow writes. GitHub Pages has to be
# told once to serve it: Settings > Pages > Build and deployment > Source "Deploy from a branch", gh-pages, / (root).
name: pages

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# one at a time: they all write the gh-pages branch
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    # pushes: only the default branch is the site; a pull request from a fork has no write access to this repository
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      # the folder on the site: the root for the default branch, pr-<number> for a pull request
      TARGET: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '.' }}
      CLOSED: ${{ github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOSED != 'true'
      - uses: actions/setup-node@v4
        if: env.CLOSED != 'true'
        with:
          node-version: 22
          cache: npm
      - name: build
        if: env.CLOSED != 'true'
        env:
          # shown by ?diag
          NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm ci
          VITE_BUILD="$NAME ${SHA::7}" npm run build
      - name: publish on the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" "$site"
          else
            git init --quiet -b gh-pages "$site"
            git -C "$site" remote add origin "$remote"
          fi
          # no Jekyll: the files are served as they are
          touch "$site/.nojekyll"
          if [ "$TARGET" = "." ]; then
            # master: everything except the previews of the pull requests
            find "$site" -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll ! -name 'pr-*' -exec rm -rf {} +
            cp -R dist/. "$site/"
          else
            rm -rf "${site:?}/$TARGET"
            if [ "$CLOSED" != "true" ]; then cp -R dist "$site/$TARGET"; fi
          fi
          cd "$site"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Publish $TARGET for $GITHUB_SHA"
          git push --quiet origin gh-pages
      - name: link the preview on the pull request
        if: github.event_name == 'pull_request' && env.CLOSED != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/pr-${number}/`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Play this pull request on a phone:** ${url}`,
              '',
              `Built from ${sha}. GitHub Pages serves it a minute or two after this comment (once Pages serves the gh-pages branch, see .github/workflows/pages.yml). ` +
                `\`${url}?diag\` also shows what the browser reports: the safe area, full screen, the sideways lock, the wake lock and the audio.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const old = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
